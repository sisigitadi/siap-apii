name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Validate Frontend & Tooling JavaScript Syntax
        run: |
          node --check portal/config.js
          node --check portal/auth.js
          node --check portal/state.js
          node --check portal/app.js
          node --check public/config.js
          node --check public/app.js
          node --check scripts/dev-server.mjs
          node --check scripts/build-apps-script.mjs
          node --check scripts/generate-html.mjs

      - name: Build Apps Script & Docs
        run: npm run build

      - name: Run Automated Test Suites
        run: npm test

