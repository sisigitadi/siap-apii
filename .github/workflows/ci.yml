name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        # Node 22+ dipakai karena uji UI portal di peramban sungguhan
        # mengandalkan WebSocket bawaan Node untuk mengendalikan Chrome/Edge
        # (lihat scripts/smoke-portal-live.mjs).
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Validate Frontend JavaScript Syntax
        run: |
          node -c portal/portal.js
          node -c portal/auth.js
          node -c portal/config.js
          node -c public/app.js
          node -c public/config.js

      - name: Pre-Push Gate (offline checks)
        # Gerbang yang sama dengan hook .githooks/pre-push, tetapi dalam MODE CI
        # (--ci): pemeriksaan yang membaca bundel hasil build apps-script/*.gs
        # dilewati beserta alasannya yang dicetak di log, karena bundel itu
        # memang tidak ikut ke repositori — ia dibangkitkan lokal, dan aset
        # sumbernya (`Dokumen Sumber/`) juga tidak ikut ke repositori.
        # Pemeriksaan yang mandiri — pemindai variabel global frontend (alias
        # `self`), penjaga mode demo & tombol masuk portal, daftar putih route,
        # dan uji UI portal di PERAMBAN SUNGGUHAN (Chrome tersedia di runner
        # ini) — tetap dijalankan penuh. Bila peramban tidak tersedia, uji itu
        # keluar dengan kode 2 dan dicetak "dilewati" beserta alasannya: bukan
        # lulus diam-diam. Gerbang lengkapnya: `npm run build:gas && npm run
        # gate:push` di klon lokal (otomatis lewat hook pra-push).
        run: npm run gate:push -- --ci

      - name: Verify Build Ready
        run: npm run build
