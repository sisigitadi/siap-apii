name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate Frontend JavaScript Syntax
        run: |
          node -c portal/portal.js
          node -c portal/auth.js
          node -c portal/config.js
          node -c public/app.js
          node -c public/config.js

      - name: Verify Build Ready
        run: npm run build
